# Tests the cloud ERP on every push, and deploys it to Cloudflare from main
# once the repository has a CLOUDFLARE_API_TOKEN secret (Settings > Secrets and variables > Actions).
name: Cloud ERP
on:
  push:
    paths: ['cloud-erp/**', 'tools/secret-scan.mjs', 'tools/sbom.mjs', '.github/workflows/cloud-erp.yml']
  pull_request:
    paths: ['cloud-erp/**', 'tools/secret-scan.mjs', 'tools/sbom.mjs', '.github/workflows/cloud-erp.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cloud-erp } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: cloud-erp/package-lock.json }
      - run: npm ci
      - name: Start the worker locally (local D1 database)
        run: |
          npx wrangler dev --port 8787 --var QUERY_COUNT:1 --var SHIPROCKET_BASE:http://127.0.0.1:8899 --var RAZORPAY_BASE:http://127.0.0.1:8897 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8787/api/health && break; sleep 1; done
      - name: End-to-end business test
        run: node test/run.mjs http://localhost:8787
      - name: Courier booking against a stand-in Shiprocket (rates, AWB, label, tracking, token renewal, NDR, returns)
        run: node test/courier.mjs http://localhost:8787
      - name: Reverse logic (two taps at once, wrong order, wrong source, silly numbers and dates, other businesses)
        run: node test/chaos.mjs http://localhost:8787
      - name: Table bills paid online against a stand-in Razorpay (payment link, signed webhook, mismatches, replays)
        run: node test/dinepay.mjs http://localhost:8787
      - name: Speed budgets (D1 calls and rows per screen; no screen reads another business's rows)
        run: node test/perf.mjs http://localhost:8787
      - name: Access control attack test (every route; anonymous, other business, low roles, removed users, forged / expired tokens)
        run: |
          npx wrangler dev --port 8788 --persist-to .access-state --var QUERY_COUNT:1 --var SESSION_SECRET:access-test-secret-0123456789 > wrangler-access.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8788/api/health && break; sleep 1; done
          node test/access.mjs http://localhost:8788
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: access-report, path: cloud-erp/test/access-report.json, if-no-files-found: ignore }
      # after every test that talks to the worker, so its log shows whichever of them failed
      - if: failure()
        run: cat wrangler.log; cat wrangler-access.log 2>/dev/null | tail -50
      - name: Adding SESSION_SECRET keeps two-step sign-in working
        run: node test/keys.mjs
      - name: Bolkar bill reads spoken orders (Hindi, Hinglish, English) as phones send them
        run: node test/voice.mjs
      - name: No secrets in the repository
        working-directory: .
        run: node tools/secret-scan.mjs
      - name: No known high or critical vulnerabilities in dependencies
        run: npm audit --audit-level=high
      - name: Software bill of materials (CycloneDX)
        working-directory: .
        run: node tools/sbom.mjs sbom.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.json }

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cloud-erp } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: cloud-erp/package-lock.json }
      - run: npm ci
      - name: Deploy to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Skipped deploy - add the CLOUDFLARE_API_TOKEN repository secret to enable it."
