# Root config so Cloudflare Workers Builds can deploy from the repository root.
# The app lives in cloud-erp/ (see cloud-erp/README.md); cloud-erp/wrangler.toml is the same config for running there.
name = "operation-structure-project"
main = "cloud-erp/src/worker.js"
compatibility_date = "2025-09-01"
# keep variables set in the Cloudflare dashboard across deploys
keep_vars = true

[assets]
directory = "./cloud-erp/public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/k/*", "/i/*", "/c/*", "/.well-known/*"]

[[d1_databases]]
binding = "DB"
database_name = "smarttrader-erp"
database_id = "65271993-a4d4-4929-93fe-fcb649d132d3"

# DocBrisk Pay + password-reset e-mails: private link to the docbrisk-api worker (same account)
[[services]]
binding = "PAYHUB_API"
service = "docbrisk-api"

# Recurring invoices and bills (06:00 India time, then hourly catch-up) and Google Drive backups (hourly, a few at a time).
# Keep in step with cloud-erp/wrangler.toml.
[triggers]
crons = ["30 0 * * *", "45 * * * *"]

# Run the worker next to the D1 database instead of next to the user: a screen makes several database calls, and each one
# then stays local, so only one round trip crosses the distance to the phone (Cloudflare Smart Placement).
[placement]
mode = "smart"

[observability]
enabled = true

# WhatsApp number for customer support (shown in the app, pricing and Plan & Billing)
[vars]
SUPPORT_WHATSAPP = "919068446139"
# address of the app, for links in messages sent by the scheduled jobs (automatic WhatsApp reminders)
APP_URL = "https://erp.docbrisk.com"
